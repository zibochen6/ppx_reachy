<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>皮皮虾 · 基地车助手</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--panel:#111923;--line:#223043;--muted:#8290a4;--text:#edf2f7;--green:#07c160;--bubble:#1b2634;--danger:#ff6b6b}
html,body{margin:0;padding:0;height:100%;overflow:hidden}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
.app{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.side{background:var(--panel);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.botlogo,.avatar{display:grid;place-items:center;background:linear-gradient(145deg,#ffd65a,#ff9f43);color:#3c2800}.botlogo{width:38px;height:38px;border-radius:12px;font-size:21px}.muted{color:var(--muted);font-size:12px}
.live{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#05080c;border:1px solid var(--line)}.live img{width:100%;height:100%;object-fit:cover}.live span{position:absolute;top:9px;right:9px;background:#06130dcc;color:#43e487;padding:3px 7px;border-radius:999px;font-size:10px}
.info{display:grid;gap:9px;padding:12px;border-radius:12px;background:#0c131c;border:1px solid var(--line)}.info-row{display:flex;justify-content:space-between;gap:10px;font-size:12px}.info-row b{font-weight:500;text-align:right}.guide{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.7}.guide strong{color:#b7c4d6}
.controls{display:grid;gap:11px;padding:12px;border-radius:12px;background:#0c131c;border:1px solid var(--line)}.control-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}.control-row button{padding:6px 10px;font-size:11px}.control-row button.on{background:#087f58;color:#fff}.volume{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}.volume label,.volume output{font-size:12px}.volume output{color:#56dfa2}.volume input{grid-column:1/-1;width:100%;accent-color:var(--green)}
.chat{min-width:0;min-height:0;display:flex;flex-direction:column;height:100%;overflow:hidden}.top{display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);background:#0e151e;gap:10px;flex-shrink:0}.status-dot{width:9px;height:9px;border-radius:50%;background:#f0b429}.status-dot.ok{background:#29d17d}.status-dot.bad{background:var(--danger)}.top-title{font-weight:650}.top-state{font-size:12px;color:var(--muted)}.spacer{flex:1}
button{border:0;border-radius:9px;background:#1b2735;color:var(--text);padding:9px 12px;cursor:pointer}.messages{flex:1;min-height:0;overflow-y:auto;padding:24px clamp(14px,4vw,58px);scroll-behavior:smooth}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);line-height:1.8}
.message{display:flex;gap:10px;margin:0 0 19px;align-items:flex-start}.message.user{flex-direction:row-reverse}.avatar{width:34px;height:34px;border-radius:10px;flex:none;font-size:18px}.message.user .avatar{background:#2b3a4e;color:#d8e2ef;font-size:14px}.body{max-width:min(74%,760px)}.meta{font-size:11px;color:var(--muted);margin:0 3px 5px}.message.user .meta{text-align:right}
.bubble{background:var(--bubble);padding:11px 14px;border-radius:5px 14px 14px 14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 10px #0002}.message.user .bubble{background:linear-gradient(145deg,#0aa06e,#078e64);border-radius:14px 5px 14px 14px}.bubble.pending:empty:after{content:"正在思考";color:var(--muted);animation:pulse 1.2s infinite}.bubble.error{border:1px solid #7b3434;color:#ffd5d5}@keyframes pulse{50%{opacity:.4}}
.attachments{display:grid;gap:8px;margin-bottom:8px}.capture{margin:0;overflow:hidden;border-radius:10px;background:#080d13;border:1px solid #33445a}.capture img{display:block;width:min(460px,100%);max-height:330px;object-fit:cover;cursor:zoom-in}.capture figcaption{padding:7px 10px;color:#a8b6c9;font-size:11px}.sources{margin-top:9px;font-size:11px;color:#9eb0c5}.sources summary{cursor:pointer}.sources a{color:#64d9a0;text-decoration:none}
.composer-wrap{border-top:1px solid var(--line);padding:10px clamp(12px,3vw,32px) 14px;background:#0e151e;flex-shrink:0}.asr{height:20px;color:#60d9a0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.composer{display:flex;align-items:flex-end;gap:10px}.composer textarea{flex:1;resize:none;max-height:130px;min-height:46px;border:1px solid #2b3a50;background:#080e15;color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;outline:none}.send{height:46px;background:#0aa06e;font-weight:650;padding:0 22px}.modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;padding:30px;z-index:9}.modal.show{display:grid}.modal img{max-width:96vw;max-height:92vh;border-radius:12px}
.file-help{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}.file-card{width:min(600px,100%);padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--panel);line-height:1.8}.file-card h1{margin-top:0}.file-card code{display:block;margin:14px 0;padding:10px 12px;border-radius:9px;background:#080e15;overflow:auto}.file-card a{display:inline-block;margin-top:8px;padding:9px 14px;border-radius:9px;background:var(--green);color:white;text-decoration:none}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.body{max-width:86%}.messages{padding:18px 12px}.top{padding:0 12px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="botlogo">🦐</div><div>皮皮虾<div class="muted">柴火基地车事实型助手</div></div></div><div class="live"><img id="liveCamera" alt="Reachy Mini 实时摄像头"><span>LIVE · 前置</span></div><div class="info"><div class="info-row"><span>对话状态</span><b id="sideState">等待连接</b></div><div class="info-row"><span>日记完整度</span><b id="journalHealth">检查中</b></div><div class="info-row"><span>前置设备</span><b id="cameraDevice">检查中</b></div><div class="info-row"><span>前置画面</span><b id="cameraHealth">检查中</b></div><div class="info-row"><span>车外后视</span><b id="rearHealth">检查中</b></div></div><div class="controls"><div class="control-row"><span>🎤 唤醒词</span><button id="wakeBtn">检查中</button></div><div class="volume"><label for="volumeRange">🔊 扬声器音量</label><output id="volumeValue">--</output><input id="volumeRange" type="range" min="0" max="100" value="70" disabled></div></div><div class="guide"><strong>摄像头路由</strong><br>“你看到什么” → Reachy 前置<br>“外面有什么” → 车外后视<br>“帮我看看” → 先询问方向</div></aside>
<main class="chat"><header class="top"><span class="status-dot" id="connDot"></span><div><div class="top-title">基地车对话</div><div class="top-state" id="topState">正在连接…</div></div><span class="spacer"></span><button id="frontBtn">看前方</button><button id="rearBtn">看车外</button><button id="danceBtn">💃 跳舞</button><button id="clearBtn">新对话</button></header>
<section class="messages" id="messages"><div class="empty" id="empty">和皮皮虾聊聊吧<br><span class="muted">基地车事实会实时核验日记；没有证据就会明确说不知道。</span></div></section>
<div class="composer-wrap"><div class="asr" id="asrText"></div><div class="composer"><textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea><button class="send" id="sendBtn">发送</button></div></div></main>
</div><div class="modal" id="modal"><img id="modalImg" alt="照片预览"></div>
<script>
if(window.location.protocol==="file:"){
document.body.innerHTML='<main class="file-help"><section class="file-card"><h1>🦐 Dashboard 需要后端服务</h1><p>这个页面不能直接双击打开，否则浏览器会把 <code>/status</code> 和摄像头地址当成 <code>file://</code> 文件。</p><p>请先在项目目录运行：</p><code>uv run chaihuo-reachy dashboard --standalone</code><p>保持终端运行，再打开下面的地址：</p><a href="http://localhost:8640/">打开 Dashboard</a></section></main>';
}else{
const $=id=>document.getElementById(id),messages=new Map();let ws=null,retry=null,wakeEnabled=false;
const names={idle:"待机",listening:"正在聆听",wake_listening:"等待唤醒",thinking:"正在思考",speaking:"正在回答",retrieving:"正在核验日记",capturing:"正在拍照",done:"已完成",error:"处理失败"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tm=s=>{try{return new Date(s).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}catch{return""}};
function sources(xs){return !xs?.length?"":`<details class="sources"><summary>查看 ${xs.length} 个日记来源</summary>${xs.map(x=>`<div>${esc(x.date||"日期未知")} · <a target="_blank" rel="noopener" href="${esc(x.url||"#")}">${esc(x.title||x.slug||"原文")}</a></div>`).join("")}</details>`}
function attachments(xs){return (xs||[]).map(x=>`<figure class="capture"><img src="${esc(x.url)}" data-full="${esc(x.url)}" alt="${esc(x.label)}"><figcaption>${esc(x.label)} · ${esc(tm(x.captured_at))}</figcaption></figure>`).join("")}
function render(m){messages.set(m.id,m);$("empty")?.remove();let row=document.querySelector(`[data-message-id="${CSS.escape(m.id)}"]`);if(!row){row=document.createElement("article");row.dataset.messageId=m.id;$("messages").appendChild(row)}row.className=`message ${m.role}`;const pending=m.role==="assistant"&&!m.text&&["thinking","retrieving","capturing","speaking"].includes(m.status);row.innerHTML=`<div class="avatar">${m.role==="user"?"你":"🦐"}</div><div class="body"><div class="meta">${m.role==="user"?"你":"皮皮虾"} · ${tm(m.created_at)}</div>${attachments(m.attachments)}<div class="bubble ${pending?"pending":""} ${m.status==="error"?"error":""}">${esc(m.text)}</div>${sources(m.sources)}</div>`;row.querySelectorAll("img[data-full]").forEach(img=>img.onclick=()=>{$("modalImg").src=img.dataset.full;$("modal").classList.add("show")});let box=$("messages"),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<60;if(atBottom)box.scrollTop=box.scrollHeight}
function history(xs){messages.clear();$("messages").innerHTML="";(xs||[]).forEach(render);if(!xs?.length)$("messages").innerHTML='<div class="empty" id="empty">和皮皮虾聊聊吧<br><span class="muted">基地车事实会实时核验日记；没有证据就会明确说不知道。</span></div>'}
function runtime(m){const j=m.journal||{};if(j.expected)$("journalHealth").textContent=`${j.complete}/${j.expected} 篇`;$("cameraDevice").textContent=String(m.camera_device||"未知").replace("avfoundation:","");$("cameraHealth").textContent=m.front_frame_age_s==null?"暂无画面":`${Number(m.front_frame_age_s).toFixed(1)} 秒前`;$("rearHealth").textContent=m.rear_camera_configured?"已配置":"未配置"}
function handle(m){if(m.type==="chat_history")history(m.messages);else if(m.type==="chat_message_upsert")render(m.message);else if(m.type==="chat_message_delta"){const old=messages.get(m.message_id);if(old)render({...old,text:(old.text||"")+m.delta,status:"streaming"})}else if(m.type==="turn_status"){$("topState").textContent=names[m.status]||m.status;$("sideState").textContent=names[m.status]||m.status}else if(m.type==="state")$("sideState").textContent=names[m.state]||m.state;else if(m.type==="transcript")$("asrText").textContent=m.text?(m.final?"听到："+m.text:"正在听："+m.text):"";else if(m.type==="runtime_status")runtime(m);else if(m.type==="volume"){$("volumeRange").value=m.volume;$("volumeValue").textContent=m.volume+"%"}else if(m.type==="wake_word"){wakeEnabled=!!m.enabled;$("wakeBtn").textContent=wakeEnabled?"已开启":"已关闭";$("wakeBtn").className=wakeEnabled?"on":""}else if(m.type==="error")$("topState").textContent=m.message||"发生错误"}
function connect(){clearTimeout(retry);const proto=window.location.protocol==="https:"?"wss:":"ws:";ws=new WebSocket(proto+"//"+window.location.host+"/ws");ws.onopen=()=>{$("connDot").className="status-dot ok";$("topState").textContent="已连接";$("volumeRange").disabled=false;ws.send(JSON.stringify({type:"get_volume"}));ws.send(JSON.stringify({type:"get_wake_word"}));ws.send(JSON.stringify({type:"get_runtime_status"}))};ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(err){console.error(err)}};ws.onclose=()=>{$("connDot").className="status-dot bad";$("topState").textContent="连接断开，正在重连…";$("volumeRange").disabled=true;retry=setTimeout(connect,1500)};ws.onerror=()=>ws.close()}
function send(text){const clean=text.trim();if(!clean||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:"chat_send",text:clean,client_message_id:"web-"+crypto.randomUUID()}));$("input").value="";resize()}
function resize(){$("input").style.height="46px";$("input").style.height=Math.min($("input").scrollHeight,130)+"px"}
async function status(){try{runtime(await(await fetch("/status",{cache:"no-store"})).json())}catch{}}
$("sendBtn").onclick=()=>send($("input").value);$("input").oninput=resize;$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(e.currentTarget.value)}};$("frontBtn").onclick=()=>send("你看到什么");$("rearBtn").onclick=()=>send("看看车外面");$("danceBtn").onclick=()=>send("跳个舞");$("clearBtn").onclick=()=>ws?.readyState===1&&ws.send(JSON.stringify({type:"clear_chat"}));$("modal").onclick=()=>$("modal").classList.remove("show");$("volumeRange").oninput=e=>{const volume=Number(e.currentTarget.value);$("volumeValue").textContent=volume+"%";if(ws?.readyState===1)ws.send(JSON.stringify({type:"set_volume",volume}))};$("wakeBtn").onclick=()=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:"set_wake_word",enabled:!wakeEnabled}))};$("liveCamera").src="/camera/stream";connect();status();setInterval(status,5000);
}
</script>
</body>
</html>
